name: Generate handwritten notes first-page preview
on:
  push:
    branches:
      - feat/handwritten-trend-pdf-previews
    paths:
      - '.github/workflows/handwritten-trend-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rendering dependencies
        run: python -m pip install 'pymupdf>=1.24,<2' 'Pillow>=10,<13'
      - name: Generate preview from the notebook itself
        run: python scripts/generate_handwritten_trend_preview.py
      - name: Commit generated preview to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/portfolio/handwritten-trend-first-page.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: render handwritten trend notes PDF cover'
            git push origin HEAD:feat/handwritten-trend-pdf-previews
          fi
