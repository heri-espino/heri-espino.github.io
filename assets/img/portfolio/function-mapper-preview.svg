<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Function Mapper illustration</title>
  <desc id="desc">Three horizontal axes with sample points linked by lines, representing stages of a function composition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a2742"/>
      <stop offset="1" stop-color="#123b63"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#dce9f5" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <text x="75" y="125" font-family="Arial,Helvetica,sans-serif" fill="#bdd7eb" font-weight="700" font-size="22" letter-spacing="5">INTERACTIVE MATHEMATICS</text>
  <text x="75" y="200" font-family="Arial,Helvetica,sans-serif" fill="#fff" font-size="62" font-weight="600">Function Mapper</text>
  <text x="75" y="248" font-family="Arial,Helvetica,sans-serif" fill="#c5d8e9" font-size="25">Functions as maps between spaces</text>
  <g stroke="#bad3e7" stroke-width="3" stroke-opacity=".8">
    <path d="M160 335H1040"/>
    <path d="M160 448H1040"/>
    <path d="M160 561H1040"/>
  </g>
  <g stroke="#bad3e7" stroke-opacity=".38" stroke-width="2">
    <path d="M160 323V347 M1040 323V347 M160 436V460 M1040 436V460 M160 549V573 M1040 549V573"/>
  </g>
  <g fill="#f0f7fd" font-family="Georgia,serif" font-size="29">
    <text x="70" y="347">x</text>
    <text x="70" y="460">f(x)</text>
    <text x="38" y="573">g(f(x))</text>
  </g>
  <g fill="none" stroke-width="3.5" opacity=".7">
    <path d="M310 335L420 448L330 561" stroke="#65dfdf"/>
    <path d="M430 335L520 448L600 561" stroke="#ffca86"/>
    <path d="M560 335L610 448L800 561" stroke="#aed2ff"/>
    <path d="M710 335L760 448L880 561" stroke="#d3c1ff"/>
    <path d="M865 335L845 448L700 561" stroke="#8fe6b2"/>
  </g>
  <g fill="#65dfdf"><circle cx="310" cy="335" r="9"/><circle cx="420" cy="448" r="9"/><circle cx="330" cy="561" r="9"/></g>
  <g fill="#ffca86"><circle cx="430" cy="335" r="9"/><circle cx="520" cy="448" r="9"/><circle cx="600" cy="561" r="9"/></g>
  <g fill="#aed2ff"><circle cx="560" cy="335" r="9"/><circle cx="610" cy="448" r="9"/><circle cx="800" cy="561" r="9"/></g>
  <g fill="#d3c1ff"><circle cx="710" cy="335" r="9"/><circle cx="760" cy="448" r="9"/><circle cx="880" cy="561" r="9"/></g>
  <g fill="#8fe6b2"><circle cx="865" cy="335" r="9"/><circle cx="845" cy="448" r="9"/><circle cx="700" cy="561" r="9"/></g>
  <text x="1077" y="343" font-family="Arial,sans-serif" font-size="21" fill="#bad3e7">R</text>
  <text x="1077" y="456" font-family="Arial,sans-serif" font-size="21" fill="#bad3e7">R</text>
  <text x="1077" y="569" font-family="Arial,sans-serif" font-size="21" fill="#bad3e7">R</text>
</svg>
