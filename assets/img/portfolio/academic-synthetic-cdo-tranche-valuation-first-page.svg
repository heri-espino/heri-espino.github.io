<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-label="Synthetic CDO Tranche Valuation A4 project first-page overview"><title>Synthetic CDO Tranche Valuation · Research-based A4 project overview</title><rect width="794" height="1123" fill="#e6eced"/><rect x="20" y="17" width="754" height="1088" fill="#fff" stroke="#d0d8db"/><rect x="20" y="17" width="754" height="10" fill="#24788c"/><text x="54" y="81" font-size="14" font-weight="800" fill="#24788c" font-family="Arial,Helvetica,sans-serif">ACADEMIC PROJECT  /  HERIBERTO ESPINO MONTELONGO</text><text x="54" y="149" font-size="33" font-weight="800" fill="#163149" font-family="Arial,Helvetica,sans-serif">Synthetic CDO Tranche Valuation</text><line x1="53" y1="225" x2="742" y2="225" stroke="#dae2e5" stroke-width="2"/><text x="54" y="255" font-size="16" font-weight="650" fill="#455d6c" font-family="Arial,Helvetica,sans-serif">LAT4092 · Credit Derivatives</text><text x="621" y="255" font-size="16" font-weight="550" fill="#455d6c" font-family="Arial,Helvetica,sans-serif">May 2026</text><text x="54" y="304" font-size="17.5" font-weight="400" fill="#3b5364" font-family="Arial,Helvetica,sans-serif">Gaussian one-factor valuation of the fifth synthetic CDO tranche, from 12% to</text><text x="54" y="330" font-size="17.5" font-weight="400" fill="#3b5364" font-family="Arial,Helvetica,sans-serif">22%.</text><rect x="64" y="390" width="665" height="296" rx="9" fill="#f8fafb" stroke="#dce3e7"/><rect x="106" y="485" width="568" height="128" rx="9" fill="#d6e7e4"/><rect x="260" y="485" width="255" height="128" fill="#f1d0a2"/><rect x="516" y="485" width="157" height="128" rx="8" fill="#d5dde6"/><text x="117" y="554" font-size="20" font-weight="700" fill="#284151" font-family="Arial,Helvetica,sans-serif">0–12%</text><text x="335" y="554" font-size="24" font-weight="800" fill="#684718" font-family="Arial,Helvetica,sans-serif">12–22%</text><text x="551" y="554" font-size="20" font-weight="700" fill="#284151" font-family="Arial,Helvetica,sans-serif">&gt; 22%</text><text x="55" y="733" font-size="14" font-weight="800" fill="#24788c" font-family="Arial,Helvetica,sans-serif">KEY CONTRIBUTIONS</text><circle cx="67" cy="784" r="4" fill="#24788c"/><text x="81" y="790" font-size="17" font-weight="400" fill="#283e50" font-family="Arial,Helvetica,sans-serif">Uses 125 CDS positions, each with 500,000 of notional.</text><circle cx="67" cy="831" r="4" fill="#24788c"/><text x="81" y="837" font-size="17" font-weight="400" fill="#283e50" font-family="Arial,Helvetica,sans-serif">Integrates common-factor credit loss using Gauss–Hermite nodes.</text><circle cx="67" cy="878" r="4" fill="#24788c"/><text x="81" y="884" font-size="17" font-weight="400" fill="#283e50" font-family="Arial,Helvetica,sans-serif">Balances expected protection and premium legs to price the tranche.</text><line x1="53" y1="983" x2="741" y2="983" stroke="#dae2e5" stroke-width="2"/><text x="55" y="1015" font-size="14" font-weight="800" fill="#24788c" font-family="Arial,Helvetica,sans-serif">ORIGINAL COURSE WORK</text><text x="55" y="1046" font-size="17" font-weight="700" fill="#30465a" font-family="Arial,Helvetica,sans-serif">ATTACH 12% · DETACH 22%</text><text x="55" y="1081" font-size="13" font-weight="400" fill="#667d8b" font-family="Arial,Helvetica,sans-serif">A4 overview based on the linked project, not an original page scan.</text></svg>